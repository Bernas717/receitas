<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#123c38">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<title>Receitas</title>
<style>
  :root{
    --green:#37a838;
    --green-dark:#2c8a2d;
    --teal:#123c38;
    --teal-2:#1b524c;
    --bg:#eaf2f4;
    --card:#ffffff;
    --line:#dfe8ea;
    --txt:#16302d;
    --muted:#6c8683;
    --red:#e23b3b;
    --amber:#e6a817;
    --blue:#2f7fb8;
    --shadow:0 2px 10px rgba(18,60,56,.08);
    --radius:16px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  /* Tamanho por omissão para os ícones. Um SVG sem largura estica até encher
     o que o contém — foi o que fez os botões de Editar e Começar ficarem
     do tamanho do ecrã. Selector de elemento, por isso qualquer regra de
     classe continua a mandar sobre ele. */
  svg{width:20px;height:20px;flex:none}
  html,body{margin:0;padding:0;height:100%}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg);color:var(--txt);
    font-size:16px;line-height:1.4;
    overscroll-behavior-y:none;
  }
  #app{max-width:560px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column;position:relative}
  button{font-family:inherit;font-size:inherit;cursor:pointer;border:none;background:none;color:inherit}
  input,textarea,select{font-family:inherit;font-size:16px;color:var(--txt)}
  .hidden{display:none!important}

  .btn{background:var(--green);color:#fff;border-radius:999px;padding:14px 18px;font-weight:700;
    display:flex;align-items:center;justify-content:center;gap:8px;box-shadow:var(--shadow);width:100%}
  .btn:active{background:var(--green-dark)}
  .btn.ghost{background:#fff;color:var(--teal);border:1.5px solid var(--line);box-shadow:none}
  .btn.danger{background:var(--red)}
  .btn.small{padding:10px 14px;font-size:14px;width:auto}
  /* Sem isto, um SVG sem largura definida estica até encher o botão. */
  .btn svg{width:18px;height:18px;flex:none}

  /* ---------- LOGIN ---------- */
  .login{flex:1;display:flex;flex-direction:column;justify-content:center;padding:28px 22px;gap:26px;
    background:linear-gradient(160deg,#f4faf6 0%,#e4f2ea 100%);min-height:100dvh}
  .brand{display:flex;flex-direction:column;align-items:center;gap:6px}
  .brand .mark{width:74px;height:74px}
  .brand .mark svg{width:100%;height:100%}
  .brand h1{margin:0;font-size:30px;letter-spacing:.5px;color:var(--green-dark);font-weight:800}
  .brand .sub{color:var(--muted);font-size:13px;font-style:italic}
  .field label{display:block;font-weight:700;margin:0 0 6px 2px;font-size:14px}
  .field .req{color:var(--red)}
  .input{width:100%;background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:14px 14px;outline:none}
  .input:focus{border-color:var(--green)}
  .sessions h2{font-size:20px;text-align:center;color:var(--teal);margin:0 0 12px}
  .sess-row{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid var(--line);
    border-radius:12px;padding:14px;margin-bottom:10px;box-shadow:var(--shadow)}
  .sess-row .ico{width:34px;height:34px;flex:none;color:var(--teal)}
  .sess-row .ico svg{width:100%;height:100%}
  .sess-row .nm{flex:1;font-weight:700}
  .sess-row .x{width:30px;height:30px;color:var(--muted);font-size:20px;display:flex;align-items:center;justify-content:center}
  .empty-note{text-align:center;color:var(--muted);font-size:14px;padding:8px}

  /* ---------- PIN ---------- */
  .pin{flex:1;display:flex;flex-direction:column;padding:22px;min-height:100dvh;background:linear-gradient(160deg,#f4faf6,#e4f2ea)}
  .pin .top{display:flex;align-items:center;gap:10px;color:var(--teal);font-weight:700;font-size:18px}
  .pin .top .back{width:34px;height:34px;display:flex;align-items:center;justify-content:center;font-size:24px}
  .pin .who{text-align:center;margin-top:18px;color:var(--muted);font-size:14px}
  .pin .who b{color:var(--txt);font-size:16px;display:block;margin-top:2px}
  .dots{display:flex;justify-content:center;gap:20px;margin:26px 0 6px}
  .dot{width:20px;height:20px;border-radius:50%;border:2px solid var(--green);}
  .dot.on{background:var(--green)}
  .att{text-align:center;color:var(--teal-2);font-weight:600;font-size:14px;min-height:20px}
  .keys{margin-top:auto;display:grid;grid-template-columns:repeat(3,1fr);gap:16px;padding:10px 24px 24px;max-width:360px;width:100%;align-self:center}
  .key{background:var(--green);color:#fff;border-radius:999px;height:64px;font-size:24px;font-weight:700;
    display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow)}
  .key:active{background:var(--green-dark)}
  .key.blank{background:transparent;box-shadow:none}
  .key.del{background:#fff;color:var(--teal);border:1.5px solid var(--line);box-shadow:none;font-size:20px}

  /* ---------- HEADER ---------- */
  .hdr{background:var(--teal);color:#fff;padding:12px 14px;display:flex;align-items:center;justify-content:space-between;
    position:sticky;top:0;z-index:20;gap:10px}
  .hdr .date{font-size:12px;opacity:.85;line-height:1.25}
  .hdr .date .clock{font-size:16px;font-weight:700;opacity:1;display:flex;align-items:center;gap:5px}
  .hdr .right{display:flex;align-items:center;gap:8px}
  .hdr .user{display:flex;align-items:center;gap:7px;background:rgba(255,255,255,.12);padding:7px 10px;border-radius:10px;font-size:13px;font-weight:600;max-width:150px}
  .hdr .user svg{width:18px;height:18px;flex:none}
  .hdr .user .un{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .hdr .logout{background:var(--red);width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex:none}
  .hdr .logout svg{width:20px;height:20px}

  /* ---------- CONTENT ---------- */
  .content{flex:1;padding:16px 14px 92px;overflow-y:auto}
  .page-title{font-size:22px;font-weight:800;margin:2px 2px 14px;color:var(--teal)}
  .search{display:flex;align-items:center;gap:10px;background:#fff;border:1.5px solid var(--line);border-radius:999px;padding:12px 16px;box-shadow:var(--shadow);margin-bottom:14px}
  .search svg{width:20px;height:20px;color:var(--green);flex:none}
  .search input{border:none;outline:none;flex:1;background:none;min-width:0}
  .search .clr{color:var(--muted);font-size:20px;width:24px;flex:none}

  /* ---------- INÍCIO ---------- */
  .hello{margin:2px 2px 14px}
  .hello .hi{font-size:22px;font-weight:800;color:var(--teal);line-height:1.2}
  .hello .sub{color:var(--muted);font-size:13px;margin-top:3px}
  .sect{display:flex;align-items:center;justify-content:space-between;margin:20px 2px 10px}
  .sect h3{margin:0;font-size:13px;text-transform:uppercase;letter-spacing:.7px;color:var(--muted);font-weight:800}
  .sect button{font-size:13px;font-weight:700;color:var(--green-dark)}
  .qa{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:4px}
  .qa button{background:#fff;border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);
    padding:16px 12px;display:flex;flex-direction:column;align-items:flex-start;gap:8px;text-align:left}
  .qa button svg{width:26px;height:26px;color:var(--green-dark)}
  .qa button .t{font-weight:700;font-size:14px;line-height:1.2}
  .qa button.primary{background:var(--green);color:#fff;border-color:var(--green)}
  .qa button.primary svg{color:#fff}
  .stat-strip{display:flex;gap:10px;margin-bottom:4px}
  .stat{flex:1;background:var(--teal);color:#fff;border-radius:14px;padding:12px 14px}
  .stat .v{font-size:24px;font-weight:800;line-height:1}
  .stat .l{font-size:11px;opacity:.8;margin-top:3px;text-transform:uppercase;letter-spacing:.5px}
  .mini-empty{background:#fff;border:1px dashed var(--line);border-radius:var(--radius);padding:18px;text-align:center;color:var(--muted);font-size:13px}

  /* ---------- CARTÃO DE RECEITA ---------- */
  .rec-card{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;margin-bottom:12px;box-shadow:var(--shadow);display:flex;align-items:center;gap:12px}
  .rec-card .ic{width:44px;height:44px;border-radius:12px;background:#eaf6ea;color:var(--green-dark);display:flex;align-items:center;justify-content:center;flex:none}
  .rec-card .ic svg{width:26px;height:26px}
  .rec-card .info{flex:1;min-width:0}
  .rec-card .info .nm{font-weight:700;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .rec-card .info .meta{color:var(--muted);font-size:13px;margin-top:2px}
  .rec-card .star{width:34px;height:34px;flex:none;display:flex;align-items:center;justify-content:center;color:#d3dedd}
  .rec-card .star svg{width:22px;height:22px}
  .rec-card .star.on{color:var(--amber)}
  .rec-card .chev{color:var(--muted);font-size:22px;flex:none}

  .empty-state{text-align:center;color:var(--muted);padding:40px 20px}
  .empty-state svg{width:54px;height:54px;opacity:.4;margin-bottom:10px}

  /* ---------- DETALHE ---------- */
  .detail-hdr{display:flex;align-items:center;gap:8px;margin-bottom:12px}
  .detail-hdr .back,.detail-hdr .act{width:38px;height:38px;border-radius:10px;background:#fff;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:22px;color:var(--teal);flex:none}
  .detail-hdr .act svg{width:20px;height:20px}
  .detail-hdr .act.star.on{color:var(--amber);border-color:var(--amber);background:#fff9e8}
  .detail-hdr .ttl{flex:1;font-size:20px;font-weight:800;color:var(--teal);line-height:1.2}
  .chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
  .chip{background:#fff;border:1px solid var(--line);border-radius:10px;padding:7px 11px;font-size:12px;color:var(--muted)}
  .chip b{color:var(--txt);font-weight:700}

  .card{background:#fff;border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:14px;overflow:hidden}
  .card .card-t{background:var(--teal);color:#fff;padding:11px 15px;font-weight:700;font-size:15px;display:flex;align-items:center;justify-content:space-between;gap:10px}
  .card .card-b{padding:14px 15px}

  .seg{display:flex;background:#eef3f4;border-radius:12px;padding:4px;margin-bottom:12px}
  .seg button{flex:1;padding:10px;border-radius:9px;font-weight:700;color:var(--muted);font-size:14px}
  .seg button.active{background:#fff;color:var(--teal);box-shadow:0 1px 4px rgba(0,0,0,.08)}
  .ref-line{font-size:12px;color:var(--muted);margin-bottom:8px;text-align:center}
  .ref-line b{color:var(--teal)}
  .calc-input{display:flex;align-items:center;gap:10px}
  .calc-input input{flex:1;min-width:0;background:#f7fafb;border:1.5px solid var(--line);border-radius:12px;padding:14px;font-size:22px;font-weight:800;text-align:right;color:var(--teal);outline:none}
  .calc-input input:focus{border-color:var(--green)}
  .calc-input .unit{font-weight:700;color:var(--muted);font-size:14px;min-width:56px}
  .factor-note{margin-top:10px;font-size:12px;color:var(--muted);text-align:center}
  .factor-note b{color:var(--green-dark)}

  table.ing{width:100%;border-collapse:collapse;font-size:14px}
  table.ing th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);padding:0 5px 8px;font-weight:700}
  table.ing th.n,table.ing td.n{text-align:right}
  table.ing td{padding:9px 5px;border-top:1px solid var(--line);vertical-align:top}
  table.ing td.nome{font-weight:600}
  table.ing tr.extra td.nome,table.ing tr.extra td{color:var(--muted)}
  table.ing tr.extra td.pesar{color:var(--blue)}
  table.ing td.pesar{font-weight:800;color:var(--green-dark);white-space:nowrap}
  table.ing td.base,table.ing td.pct{color:var(--muted);white-space:nowrap}
  table.ing tr.sep td{border-top:2px solid var(--teal);font-weight:800;padding-top:11px}
  table.ing tr.fase td{border-top:0;padding-top:1px;padding-bottom:1px;font-size:12.5px;color:var(--muted);font-weight:500}
  table.ing tr.fase td.nome{padding-left:14px;font-weight:500}
  table.ing tr.fase td.pesar{color:var(--teal-2);font-weight:700}
  table.ing tr.fase.last td{padding-bottom:8px}
  table.ing tr.fase .arw{color:var(--blue);margin-right:5px;font-weight:800}
  .tag{display:inline-block;font-size:9px;font-weight:800;letter-spacing:.3px;padding:1px 5px;border-radius:4px;vertical-align:middle;margin-right:5px}
  .tag.far{background:#fff3d6;color:#a87a00}
  .tag.ref{background:#dff0dd;color:var(--green-dark)}
  .tag.ext{background:#e3eef7;color:var(--blue)}
  .tag.fas{background:#ece4f7;color:#6b46a8}
  .legend{font-size:11px;color:var(--muted);margin-top:12px;line-height:1.6}

  .prep{padding-left:20px;margin:0}
  .prep li{margin-bottom:8px;font-size:14px}
  .desc{font-size:14px;color:var(--muted);font-style:italic;margin:0 2px 12px}

  .ing-s{display:flex;align-items:center;gap:6px;margin-bottom:8px}
  .ing-s .nm{flex:1;min-width:0;padding:11px}
  .ing-s .qt{width:66px;flex:none;text-align:right;padding:11px 6px}
  .ing-s .qt:disabled{background:#f0f4f5;color:var(--muted)}
  .ing-s .un{width:86px;flex:none;padding:11px 4px;font-size:13px;background:#fff;
    -webkit-appearance:none;appearance:none;text-align:center;text-align-last:center}
  .ing-s .rm{flex:none;width:30px;height:42px;color:var(--red);font-size:22px;display:flex;align-items:center;justify-content:center}

  /* ---------- CABEÇALHO DA ÁREA ---------- */
  .area-hd{display:flex;align-items:center;gap:14px;margin:2px 2px 16px}
  .area-hd .ic{width:56px;height:56px;flex:none;border-radius:16px;background:#eaf6ea;color:var(--green-dark);
    display:flex;align-items:center;justify-content:center}
  .area-hd .ic svg{width:32px;height:32px}
  .area-hd h1{margin:0;font-size:26px;font-weight:800;color:var(--teal);line-height:1.1}
  .area-hd .s{color:var(--muted);font-size:13.5px;margin-top:3px}

  .busca-lin{display:flex;gap:10px;margin-bottom:14px}
  .busca-lin .search{flex:1;margin:0;min-width:0}
  .btn-nova{flex:none;background:var(--green);color:#fff;border-radius:14px;padding:0 18px;
    font-weight:800;font-size:14.5px;display:flex;align-items:center;gap:7px;box-shadow:var(--shadow);white-space:nowrap}
  .btn-nova svg{width:20px;height:20px}
  .btn-nova:active{background:var(--green-dark)}
  @media(max-width:430px){ .btn-nova span{display:none} .btn-nova{padding:0 16px} }

  .subs{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 4px;margin-bottom:12px;scrollbar-width:none}
  .subs::-webkit-scrollbar{display:none}
  .subs button{flex:none;padding:10px 16px;border-radius:12px;border:1.5px solid var(--line);background:#fff;
    font-weight:700;font-size:14px;color:var(--muted);white-space:nowrap}
  .subs button.on{background:#eaf6ea;border-color:var(--green);color:var(--green-dark)}

  .ord-lin{display:flex;align-items:center;gap:10px;margin-bottom:12px}
  .ord-lin .lbl{font-size:13.5px;color:var(--muted);flex:none}
  .ord-lin select{flex:1;min-width:0;background:#fff;border:1.5px solid var(--line);border-radius:12px;
    padding:10px 12px;font-size:14px;font-weight:600;color:var(--teal);-webkit-appearance:none;appearance:none}
  .vistas{display:flex;gap:6px;flex:none}
  .vistas button{width:42px;height:42px;border-radius:11px;border:1.5px solid var(--line);background:#fff;
    color:var(--muted);display:flex;align-items:center;justify-content:center}
  .vistas button svg{width:20px;height:20px}
  .vistas button.on{background:var(--teal);border-color:var(--teal);color:#fff}

  /* ---------- CARTÃO DE RECEITA COM FOTO ---------- */
  .rc{display:flex;align-items:stretch;gap:0;background:#fff;border:1px solid var(--line);border-radius:var(--radius);
    margin-bottom:12px;box-shadow:var(--shadow);overflow:hidden}
  .rc .foto{width:104px;flex:none;background:linear-gradient(145deg,#eaf6ea,#d7ebd7);position:relative;
    display:flex;align-items:center;justify-content:center;color:var(--green-dark)}
  .rc .foto img{width:100%;height:100%;object-fit:cover;display:block}
  .rc .foto svg{width:38px;height:38px;opacity:.5}
  .rc .corpo{flex:1;min-width:0;padding:12px 6px 12px 14px}
  .rc .nm{font-weight:800;font-size:16.5px;color:var(--teal);line-height:1.2;
    overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
  .rc .info{display:flex;flex-wrap:wrap;gap:12px;margin-top:6px;color:var(--muted);font-size:13px}
  .rc .info span{display:flex;align-items:center;gap:5px}
  .rc .info svg{width:15px;height:15px;flex:none}
  .rc .tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
  .rc .tg{font-size:11.5px;font-weight:700;padding:4px 9px;border-radius:7px}
  .rc .tg.sub{background:#e4f3e4;color:var(--green-dark)}
  .rc .tg.dif-facil{background:#eef4f5;color:var(--muted)}
  .rc .tg.dif-media{background:#e3eef7;color:var(--blue)}
  .rc .tg.dif-dificil{background:#fde4e4;color:#b32b2b}
  .rc .lado{flex:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:0 10px 0 4px}
  .rc .cor{width:38px;height:38px;display:flex;align-items:center;justify-content:center;color:#d3dedd}
  .rc .cor svg{width:24px;height:24px}
  .rc .cor.on{color:#e8384f}
  .rc .chev{color:var(--muted);font-size:22px;line-height:1}

  /* grelha */
  .grelha{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .grelha .rc{flex-direction:column;margin:0}
  .grelha .rc .foto{width:100%;height:112px}
  .grelha .rc .corpo{padding:11px 12px 12px}
  .grelha .rc .nm{font-size:15px}
  .grelha .rc .info{gap:9px;font-size:12px;margin-top:5px}
  .grelha .rc .lado{flex-direction:row;justify-content:space-between;padding:0 8px 8px 10px}

  /* ---------- DETALHE COM FOTO ---------- */
  .det-top{display:flex;align-items:center;gap:8px;margin-bottom:12px}
  .det-top .bt{width:42px;height:42px;flex:none;border-radius:12px;background:#fff;border:1px solid var(--line);
    display:flex;align-items:center;justify-content:center;color:var(--teal);box-shadow:var(--shadow)}
  .det-top .bt svg{width:21px;height:21px}
  .det-top .bt.cor.on{color:#e8384f}
  .det-top .tt{flex:1;min-width:0;font-size:23px;font-weight:800;color:var(--teal);line-height:1.15}
  .det-foto{border-radius:var(--radius);overflow:hidden;margin-bottom:14px;height:200px;
    background:linear-gradient(145deg,#eaf6ea,#d7ebd7);display:flex;align-items:center;justify-content:center;color:var(--green-dark)}
  .det-foto img{width:100%;height:100%;object-fit:cover;display:block}
  .det-foto svg{width:64px;height:64px;opacity:.45}

  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}
  .stats .st{background:#fff;border:1px solid var(--line);border-radius:14px;padding:11px 6px;text-align:center;box-shadow:var(--shadow)}
  .stats .st svg{width:20px;height:20px;color:var(--green-dark);margin-bottom:3px}
  .stats .st .v{font-weight:800;font-size:15px;color:var(--teal);line-height:1.15}
  .stats .st .l{font-size:10.5px;color:var(--muted);margin-top:2px}
  .stats .st.toca{border-color:var(--green);background:#f7fcf7}
  .stats .st.toca .v{color:var(--green-dark)}

  .abas{display:flex;gap:8px;margin-bottom:14px}
  .abas button{flex:1;padding:13px 8px;border-radius:13px;border:1.5px solid var(--line);background:#fff;
    font-weight:700;font-size:14.5px;color:var(--muted);display:flex;align-items:center;justify-content:center;gap:7px}
  .abas button svg{width:18px;height:18px}
  .abas button.on{background:var(--green);border-color:var(--green);color:#fff;box-shadow:var(--shadow)}

  .cx-topo{display:flex;align-items:flex-start;gap:10px}

  .zona-img{border:2px dashed var(--line);border-radius:14px;padding:18px;display:flex;align-items:center;gap:12px;

  .img-prev img{width:100%;height:100%;object-fit:cover;display:block}
  .img-prev .rmf{position:absolute;top:9px;right:9px;width:34px;height:34px;border-radius:11px;

  .rodape{position:fixed;bottom:0;left:0;right:0;max-width:560px;margin:0 auto;z-index:40;

    display:flex;align-items:center;justify-content:center;gap:8px}

  /* ---------- MODO SIMPLES ---------- */

  .doses button{flex:none;width:48px;height:48px;border-radius:13px;background:var(--green);color:#fff;

  /* ---------- FORM ---------- */
  .form .field{margin-bottom:14px}

  .form .row2{display:flex;gap:10px}

  .ing-card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:10px}

  .ing-card .l1 .in-qtd{width:84px;flex:none;text-align:right;padding:11px 8px}
  .ing-card .l1 .rm{flex:none;width:34px;height:40px;color:var(--red);font-size:22px;display:flex;align-items:center;justify-content:center}

  .pill.ref.on{background:#dff0dd;border-color:var(--green);color:var(--green-dark)}
  .pill.ext.on{background:#e3eef7;border-color:var(--blue);color:var(--blue)}

  .form-actions{display:flex;flex-direction:column;gap:10px;margin-top:20px}

  /* ---------- DEFINIÇÕES ---------- */
  .set-group{background:#fff;border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:14px;overflow:hidden}

  temperos:   {modo:'simples', dose:'doses',    dose1:'dose',    exemplo:'Ex.: Tempero para Frango', rendePad:1,  unidadePad:'c. chá'},
};

function perfil(id){ return PERFIL[id] || PERFIL.pao; }
function perfilAtual(){ return perfil(STATE.categoria); }
function ehSimples(id){ return perfil(id).modo === 'simples'; }

/* ---- modo simples: a receita rende N, queres M, tudo × M/N ---- */
function rendeBase(r){ const n=+r.rende||0; return n>0?n:(perfil(r.categoria).rendePad||4); }
function fatorSimples(r){
  const v=pnum(STATE.calcValue);
  if(isNaN(v)||v<=0) return 1;
  const b=rendeBase(r);
  const f=b>0?v/b:1;
  return (isFinite(f)&&f>0)?f:1;
}
/* "q.b." não tem quantidade nenhuma para multiplicar */
function ehQB(i){ return i.unidade==='q.b.' || (!(+i.qtd>0) && !String(i.qtd||'').trim()); }
/* 500 g × 1,5 = 750 g. Sem casas decimais inúteis: 1,5 un fica 1,5; 750 g fica 750 */
function qtdTexto(i, fator){
  if(ehQB(i)) return 'q.b.';
  const v=(+i.qtd||0)*(fator||1);
  const dec = v<10 ? 2 : (v<100 ? 1 : 0);
  let txt=nfmt(v,dec);
  if(txt.includes(',')) txt=txt.replace(/,?0+$/,'');
  return txt + (i.unidade?(' '+i.unidade):'');
}

/* ---------- Persistência ---------- */
function load(key, def){ try{ const v=localStorage.getItem(key); return v?JSON.parse(v):def; }catch(e){ return def; } }

/* A sessão vive no sessionStorage, não no localStorage: o telemóvel limpa-o
   quando a app é mesmo fechada, mas mantém-no enquanto ela está em segundo
   plano. Resultado: trocar para o WhatsApp e voltar não pede PIN; fechar pede. */
function loadS(key, def){ try{ const v=sessionStorage.getItem(key); return v?JSON.parse(v):def; }catch(e){ return def; } }
function saveS(key, val){ try{ sessionStorage.setItem(key, JSON.stringify(val)); }catch(e){} }
function dropS(key){ try{ sessionStorage.removeItem(key); }catch(e){} }
function save(key, val){
  try{ localStorage.setItem(key, JSON.stringify(val)); }
  catch(e){
    /* quase sempre é o armazenamento cheio, e quase sempre por causa das fotos */
    toast('Sem espaço para guardar. Apaga fotos de receitas antigas.');
  }
}

/* Atualiza as receitas de exemplo sem tocar nas do utilizador.
   Uma receita de exemplo que tenhas editado fica marcada (dirty) e nunca é substituída. */
function reconcileSeed(list){
  const fresh = seedRecipes().map(migrate);
  let out = list.slice();
  let n = 0;

  /* 1º passo: versões antigas perdiam a marca ao guardar, ficando "órfãs".
     Reatribuir a marca pelo nome, para que o passo seguinte as reconheça
     como sendo a mesma receita e não crie mais uma cópia. */
  fresh.forEach(f=>{
    const o = out.findIndex(r=>!r.seedId && r.nome.trim().toLowerCase()===f.nome.trim().toLowerCase());
    if(o >= 0){ out[o].seedId=f.seedId; out[o].dirty=true; }
  });

  /* 2º passo: atualizar as que não foram tocadas por ti */
  fresh.forEach(f=>{
    const i = out.findIndex(r=>r.seedId===f.seedId);
    if(i < 0){ out.push(f); n++; return; }
    if(out[i].dirty) return;
    f.id = out[i].id;                 // manter o id (favoritos e recentes continuam a apontar)
    f.favorito = out[i].favorito;
    out[i] = f; n++;
  });

  const d = dedupe(out);
  out = d.list;
  if(d.removidas) setTimeout(()=>toast(d.removidas+' receita(s) duplicada(s) removida(s)'), 700);
  else if(n)      setTimeout(()=>toast(n+' receita(s) de exemplo atualizada(s)'), 500);
  return out;
}

/* Limpa duplicados já criados por versões anteriores.
   Entre duas cópias fica a que tu editaste; nunca apaga receitas tuas. */
function dedupe(list){
  const vistos = {}; const out = []; let removidas = 0;
  list.forEach(r=>{
    const chave = r.seedId ? 'seed:'+r.seedId : null;
    if(!chave){ out.push(r); return; }          // receita tua: nunca mexer
    if(!(chave in vistos)){ vistos[chave]=out.length; out.push(r); return; }
    const j = vistos[chave];
    /* ficam os teus dados: a editada ganha; senão a que tem favorito */
    const fica = r.dirty && !out[j].dirty ? r : out[j];
    fica.favorito = out[j].favorito || r.favorito;
    out[j] = fica; removidas++;
  });
  return {list:out, removidas:removidas};
}

/* Migração / normalização de receitas antigas */
function migrate(r){
  r.ingredientes = (r.ingredientes||[]).map(i=>({
    nome:i.nome||'', qtd:+i.qtd||0, farinha:!!i.farinha,
    extra: i.extra!==undefined ? !!i.extra : /tender|arroz/i.test(i.nome||''),
    fases: Array.isArray(i.fases)
      ? i.fases.map(f=>({nome:f.nome||'', qtd:+f.qtd||0})).filter(f=>f.nome!==''||f.qtd>0)
      : []
  }));
  if(typeof r.refIdx!=='number' || !r.ingredientes[r.refIdx]){
    const fi=r.ingredientes.findIndex(i=>i.farinha && !i.extra);
    r.refIdx = fi>=0?fi:0;
  }
  if(!CAT_POR_ID[r.categoria]) r.categoria='pao';
  if(r.favorito===undefined) r.favorito=false;
  if(ehSimples(r.categoria)){
    const pf=perfil(r.categoria);
    if(!(+r.rende>0)) r.rende=pf.rendePad||4;
    r.ingredientes.forEach(i=>{ if(!i.unidade) i.unidade=pf.unidadePad||'g'; });
  }
  if(typeof r.foto!=='string') r.foto='';
  if(!(+r.tempo>0)) r.tempo=0;
  if(DIFICULDADES.indexOf(r.dificuldade)<0) r.dificuldade='Fácil';
  if(subsDe(r.categoria).indexOf(r.sub)<0) r.sub='';
  if(!r.criada) r.criada=0;
  return r;
}

/* =====================================================================
   Números (pt-PT: vírgula decimal)
   ===================================================================== */
function nfmt(v, dec=3){
  if(v==null||isNaN(v)||!isFinite(v)) return '—';
  return v.toLocaleString('pt-PT',{minimumFractionDigits:dec,maximumFractionDigits:dec});
}
/* Valor para dentro de um <input>: vírgula decimal, como em Portugal */
function vfmt(v){
  if(v===''||v==null) return '';
  if(typeof v==='number' && isNaN(v)) return '';
  return String(v).replace('.',',');
}
function pnum(s){
  if(typeof s==='number') return s;
  if(s==null||s==='') return NaN;
  return parseFloat(String(s).trim().replace(',','.'));
}

/* ---------- Motor de cálculo ---------- */
/* Referência de escala: o ingrediente marcado REF (como a caixa sombreada da ficha) */
function refIng(r){ return r.ingredientes[r.refIdx] || r.ingredientes[0] || null; }
function baseRef(r){ const i=refIng(r); return i?i.qtd:0; }
/* Soma das farinhas = 100% (só para a coluna de percentagem) */
function baseFlour(r){ return r.ingredientes.filter(i=>i.farinha&&!i.extra).reduce((s,i)=>s+i.qtd,0); }
/* Rendimento da massa: exclui os EXTRA (tender, arroz) */
function baseYield(r){ return r.ingredientes.filter(i=>!i.extra).reduce((s,i)=>s+i.qtd,0); }
function baseUnits(r){ const pm=+r.pesoMassa||0; return pm>0 ? Math.round(baseYield(r)*1000/pm) : 0; }

function factorOf(r){
  if(ehSimples(r.categoria)) return fatorSimples(r);
  const v=pnum(STATE.calcValue);
  if(isNaN(v)||v<=0) return 1;
  let f=1;
  if(STATE.calcMode==='farinha'){ const b=baseRef(r); f = b>0 ? v/b : 1; }
  else { const b=baseYield(r); const pm=+r.pesoMassa||0; f = (b>0&&pm>0) ? (v*pm/1000)/b : 1; }
  return (isFinite(f)&&f>0) ? f : 1;
}

function renderPin(){
  const setup=STATE.pinSetup;
  const who = setup ? setup.name : (STATE.pinUser?STATE.pinUser.name:'');
  const title = setup ? (setup.step===1?'Defina um PIN de 4 dígitos':'Confirme o PIN') : 'Digite o seu PIN';
  const dots = [0,1,2,3].map(i=>`<div class="dot ${i<STATE.pinBuf.length?'on':''}"></div>`).join('');
  const att = setup ? '' : `Tem ${STATE.pinAttempts} tentativa${STATE.pinAttempts===1?'':'s'}.`;
  const keys = [1,2,3,4,5,6,7,8,9,'blank',0,'del'].map(k=>{
    if(k==='blank') return `<div class="key blank"></div>`;
    if(k==='del')   return `<button class="key del" data-k="del">⌫</button>`;
    return `<button class="key" data-k="${k}">${k}</button>`;
  }).join('');

  $app.innerHTML=`

    <div class="att">${att}</div>

  document.getElementById('pinBack').onclick=()=>{ STATE.pinSetup=null; STATE.pinUser=null; STATE.pinBuf=''; STATE.screen='login'; render(); };

function pinPress(k){
  if(k==='del'){ STATE.pinBuf=STATE.pinBuf.slice(0,-1); return renderPin(); }
  if(STATE.pinBuf.length>=4) return;
  STATE.pinBuf+=k; renderPin();
  if(STATE.pinBuf.length===4) setTimeout(pinComplete,120);
}
function pinComplete(){
  const setup=STATE.pinSetup;
  if(setup){
    if(setup.step===1){ setup.first=STATE.pinBuf; setup.step=2; STATE.pinBuf=''; return renderPin(); }
    if(STATE.pinBuf===setup.first){
      const u={id:uid(),name:setup.name,pin:setup.first}; users.push(u); save(K.users,users);
      STATE.pinSetup=null; enterApp(u);
    }else{ toast('Os PIN não coincidem'); setup.step=1; setup.first=''; STATE.pinBuf=''; renderPin(); }
    return;
  }
  if(STATE.pinBuf===STATE.pinUser.pin) enterApp(STATE.pinUser);
  else{
    STATE.pinAttempts--; STATE.pinBuf='';
    if(STATE.pinAttempts<=0){ toast('PIN incorreto'); STATE.pinUser=null; STATE.screen='login'; render(); }
    else{ toast('PIN incorreto'); renderPin(); }
  }
}

/* Linha de resumo de uma receita — só mostra o que a receita tem de facto */
function metaLinha(r){
  const pf=perfil(r.categoria);
  if(ehSimples(r.categoria)){
    const n=rendeBase(r);
    return `${n} ${n===1?pf.dose1:pf.dose} · ${r.ingredientes.length} ingredientes`;
  }
  const p=[];
  if(r.codigo) p.push('Cód. '+esc(r.codigo));
  p.push(nfmt(baseRef(r),3)+' kg '+esc(refIng(r)?refIng(r).nome:pf.semBase));
  if((+r.pesoMassa||0)>0) p.push(baseUnits(r)+' '+esc(pf.unidade)+' de '+nfmt(+r.pesoMassa,0)+' g');
  return p.join(' · ');
}

/* Tempo em texto curto: 95 -> "1h35", 35 -> "35 min" */
function tempoTexto(m){
  m=+m||0; if(!m) return '—';
  if(m<60) return m+' min';
  const h=Math.floor(m/60), r=m%60;
  return r? `${h}h${String(r).padStart(2,'0')}` : `${h}h`;
}
function classeDif(d){
  return 'dif-'+String(d||'Fácil').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
}
/* quantas doses/unidades a receita rende, em texto */
function rendeTexto(r){
  const pf=perfil(r.categoria);
  if(ehSimples(r.categoria)){ const n=rendeBase(r); return n+' '+(n===1?pf.dose1:pf.dose); }
  const n=baseUnits(r); return n? n+' '+pf.unidade : nfmt(baseRef(r),1)+' kg';
}
/* Tudo o que a app mostra é da área escolhida. Sem isto, escolher Sopas
   e continuar a ver os pães tornava o ecrã de escolha decorativo. */
function receitasAtuais(){
  if(!STATE.categoria) return recipes;
  return recipes.filter(r=>r.categoria===STATE.categoria);
}

function filtered(){
  const q=STATE.search.trim().toLowerCase();
  let list=receitasAtuais().slice();
  if(STATE.sub) list=list.filter(r=>r.sub===STATE.sub);
  if(q) list=list.filter(r=> r.nome.toLowerCase().includes(q) || (r.codigo||'').includes(q) || (r.plu||'').includes(q));

  const az=(a,b)=>a.nome.localeCompare(b.nome,'pt');
  const cmp={
    az:  az,
    za:  (a,b)=>az(b,a),
    tempo:(a,b)=>((+a.tempo||9999)-(+b.tempo||9999))||az(a,b),
    novas:(a,b)=>((+b.criada||0)-(+a.criada||0))||az(a,b),
  }[STATE.ordem]||az;

  /* favoritas primeiro, e só depois a ordem escolhida */
  return list.sort((a,b)=> (a.favorito!==b.favorito) ? (a.favorito?-1:1) : cmp(a,b));
}
function fotoDe(r, tam){
  return r.foto
    ? `<img src="${esc(r.foto)}" alt="">`
    : IC[iconeCat(r.categoria)];
}

function recipeList(list){
  if(!list.length) return `<div class="empty-state">${IC[iconeCat(STATE.categoria)]}<div>${
    STATE.search||STATE.sub ? 'Nenhuma receita encontrada.'
                 : 'Ainda não há receitas em <b>'+esc(cat(STATE.categoria).nome)+'</b>.<br>Toca em <b>Nova receita</b> para criar a primeira.'
  }</div></div>`;

  const cartoes=list.map(r=>`
    <div class="rc" data-open="${r.id}">
      <div class="foto">${fotoDe(r)}</div>
      <div class="corpo">
        <div class="nm">${esc(r.nome)}</div>
        <div class="info">
          ${ehSimples(r.categoria)&&+r.tempo>0?`<span>${IC.relogio}${tempoTexto(r.tempo)}</span>`:''}
          <span>${IC.pessoa}${esc(rendeTexto(r))}</span>
          ${!ehSimples(r.categoria)&&r.codigo?`<span>${IC.etiqueta}${esc(r.codigo)}</span>`:''}
        </div>
        ${ehSimples(r.categoria)?`<div class="tags">
          ${r.sub?`<span class="tg sub">${esc(r.sub)}</span>`:''}
          <span class="tg ${classeDif(r.dificuldade)}">${esc(r.dificuldade||'Fácil')}</span>
        </div>`:''}
      </div>
      <div class="lado">
        <button class="cor ${r.favorito?'on':''}" data-fav="${r.id}">${r.favorito?IC.coracaoOn:IC.coracaoOff}</button>
        <div class="chev">&rsaquo;</div>
      </div>
    </div>`).join('');

  return STATE.vista==='grelha' ? `<div class="grelha">${cartoes}</div>` : cartoes;
}

/* =====================================================================
   MODO SIMPLES — sopas, cozinha, pastelaria, temperos
   ===================================================================== */
/* Cabeçalho comum: foto, quatro estatísticas e separadores.
   Serve as duas modalidades; só muda o que vai dentro de "Ingredientes". */
function detCabeca(r){
  const pf=perfil(r.categoria);
  const aEscalar = STATE.calcValue!=null && pnum(STATE.calcValue)>0;
  const fator = factorOf(r);
  const alvo = ehSimples(r.categoria)
      ? (aEscalar ? nfmt(pnum(STATE.calcValue),0)+' '+pf.dose : rendeTexto(r))
      : (aEscalar ? nfmt(pnum(STATE.calcValue),3)+' kg' : rendeTexto(r));

  /* A Padaria não tem tempo nem dificuldade para editar, por isso também
     não os mostra; em vez disso mostra o peso por unidade, que lá interessa. */
  const indic=[`<div class="st${aEscalar?' toca':''}">${IC.pessoa}<div class="v">${esc(alvo)}</div><div class="l">${aEscalar?'ajustado':'rende'}</div></div>`];
  if(ehSimples(r.categoria)){
    indic.push(`<div class="st">${IC.relogio}<div class="v">${esc(tempoTexto(r.tempo))}</div><div class="l">preparação</div></div>`);
    indic.push(`<div class="st">${IC.nivel}<div class="v">${esc(r.dificuldade||'Fácil')}</div><div class="l">dificuldade</div></div>`);
    indic.push(`<div class="st">${IC.etiqueta}<div class="v">${esc(r.sub||cat(r.categoria).nome)}</div><div class="l">categoria</div></div>`);
  }else{
    if((+r.pesoMassa||0)>0)
      indic.push(`<div class="st">${IC.nivel}<div class="v">${nfmt(+r.pesoMassa,0)} g</div><div class="l">por unidade</div></div>`);
    if(r.codigo)
      indic.push(`<div class="st">${IC.etiqueta}<div class="v">${esc(r.codigo)}</div><div class="l">código</div></div>`);
  }

  return `
    <div class="det-top">
      <button class="bt" data-back>&larr;</button>
      <div class="tt">${esc(r.nome)}</div>
      <button class="bt cor ${r.favorito?'on':''}" data-fav="${r.id}">${r.favorito?IC.coracaoOn:IC.coracaoOff}</button>
      <button class="bt" data-edit="${r.id}">${IC.edit}</button>
    </div>

    <div class="det-foto">${fotoDe(r)}</div>

    <div class="stats" style="grid-template-columns:repeat(${indic.length},1fr)">
      ${indic.join('')}
    </div>

    ${r.descricao?`<p class="desc">${esc(r.descricao)}</p>`:''}

    <div class="abas">
      <button data-aba="ingredientes" class="${STATE.aba!=='preparacao'?'on':''}">${IC.list}Ingredientes</button>
      <button data-aba="preparacao"   class="${STATE.aba==='preparacao'?'on':''}">${IC.bread}Preparação</button>
    </div>`;
}

/* Caixa das doses, só aparece quando tocas na estatística */
/* Sempre visível: aumentar e diminuir a dose é a razão de ser do ecrã,
   tal como o Calcular na Padaria. Não fica atrás de nenhum toque. */
function caixaEscala(r){
  const pf=perfil(r.categoria);
  if(ehSimples(r.categoria)){
    const base=rendeBase(r);
    const v=pnum(STATE.calcValue);
    const alvo=(!isNaN(v)&&v>0)?v:base;
    const mudou=Math.abs(alvo-base)>0.001;
    return `
    <div class="card">
      <div class="card-t"><span>Para quantas ${esc(pf.dose)}?</span>
        ${mudou?`<button class="btn ghost small" data-reset style="padding:6px 12px">Repor ${base}</button>`:''}</div>
      <div class="card-b">
        <div class="doses">
          <button data-dose="-1" aria-label="Menos">&minus;</button>
          <input id="calcVal" inputmode="numeric" value="${STATE.calcValue!=null?esc(String(STATE.calcValue)):''}" placeholder="${base}">
          <button data-dose="1" aria-label="Mais">+</button>
        </div>
        <div class="doses-nota">${mudou
          ? `Receita para <b>${base}</b> · quantidades ajustadas para <b>${nfmt(alvo,0)}</b>`
          : `A receita rende <b>${base}</b> ${esc(base===1?pf.dose1:pf.dose)}`}</div>
      </div>
    </div>`;
  }
  const ref=refIng(r), br=baseRef(r), bu=baseUnits(r);
  return `
    <div class="card">
      <div class="card-t"><span>Calcular</span><button class="btn ghost small" data-reset style="padding:6px 12px">Repor</button></div>
      <div class="card-b">
        ${(+r.pesoMassa||0)>0?`<div class="seg">
          <button data-mode="farinha"  class="${STATE.calcMode==='farinha'?'active':''}">${esc(pf.porBase)}</button>
          <button data-mode="unidades" class="${STATE.calcMode==='unidades'?'active':''}">Por ${esc(pf.unidades)}</button>
        </div>`:''}
        <div class="ref-line">${STATE.calcMode==='farinha'
          ? `Referência: <b>${esc(ref?ref.nome:'—')}</b> (base ${nfmt(br,3)} kg)`
          : `Base: <b>${bu}</b> ${esc(pf.unidades)} de ${nfmt(+r.pesoMassa||0,0)} g`}</div>
        <div class="calc-input">
          <input id="calcVal" inputmode="decimal" value="${STATE.calcValue!=null?esc(String(STATE.calcValue)):''}" placeholder="${STATE.calcMode==='farinha'?nfmt(br,3):String(bu)}">
          <span class="unit">${STATE.calcMode==='farinha'?'kg':esc(pf.unidade)}</span>
        </div>
        <div class="factor-note" id="factorNote">Fator <b>${nfmt(factorOf(r),3)}×</b></div>
      </div>
    </div>`;
}

function blocoPreparacao(r){
  if(!(r.preparacao&&r.preparacao.length))

function botoesDet(r){

/* ---------------- DETALHE — modo simples ---------------- */
function viewDetailSimples(r){
  const fator=fatorSimples(r);
  const linhas=r.ingredientes.map(i=>`
    <div class="li">
      <span class="pt"></span>
      <span class="nm">${esc(i.nome)}</span>
      <span class="qt" ${ehQB(i)?'':`data-q="${i.qtd}" data-u="${esc(i.unidade||'')}"`}>${qtdTexto(i,fator)}</span>

/* ---------------- DETALHE — modo padaria ----------------
   Estrutura fixa: Calcular, Matérias-primas, Preparação.
   A calculadora está sempre aberta — é para isso que se abre a receita. */
function viewDetail(){
  const r=recipes.find(x=>x.id===STATE.activeRecipe);
  if(!r){ STATE.view='list'; return viewReceitas(); }
  if(ehSimples(r.categoria)) return viewDetailSimples(r);

  const pf=perfil(r.categoria);
  const bf=baseFlour(r), by=baseYield(r), bu=baseUnits(r), br=baseRef(r);
  const ref=refIng(r);
  const temPeso=(+r.pesoMassa||0)>0;
  if(!temPeso && STATE.calcMode==='unidades'){ STATE.calcMode='farinha'; STATE.calcValue=null; }
  const factor=factorOf(r);

  const rows=r.ingredientes.map((i,idx)=>{
    i.fases=i.fases||[];
    const pct = bf>0 ? (i.qtd/bf*100) : null;
    const tags = (idx===r.refIdx?'<span class="tag ref">REF</span>':'')
               + (i.farinha?`<span class="tag far">${esc(pf.base.sigla)}</span>`:'')
               + (i.extra?`<span class="tag ext">${esc(pf.fora.sigla)}</span>`:'')
               + (i.fases.length?'<span class="tag fas">FASES</span>':'');
    let html=`<tr class="${i.extra?'extra':''}">
      <td class="nome">${tags}${esc(i.nome)}</td>
      <td class="base n">${nfmt(i.qtd,3)}</td>
      <td class="pct n">${pct==null?'—':nfmt(pct,2)+'%'}</td>
      <td class="pesar n" data-q="${i.qtd}">${nfmt(i.qtd*factor,3)}</td>
    </tr>`;
    i.fases.forEach((fa,fi)=>{
      html+=`<tr class="fase ${fi===i.fases.length-1?'last':''}">
        <td class="nome"><span class="arw">&#8627;</span>${esc(fa.nome)}</td>
        <td class="base n">${nfmt(fa.qtd,3)}</td>
        <td class="pct n"></td>
        <td class="pesar n" data-q="${fa.qtd}">${nfmt(fa.qtd*factor,3)}</td>
      </tr>`;
    });
    return html;
  }).join('');

  const totMass=by*factor;
  const totUnits=temPeso?Math.round(totMass*1000/(+r.pesoMassa)):0;

  const chips=[
    r.codigo?`<div class="chip">Código <b>${esc(r.codigo)}</b></div>`:'',
    r.plu?`<div class="chip">PLU <b>${esc(r.plu)}</b></div>`:'',
    temPeso?`<div class="chip">${esc(pf.pesoLabel.replace(/\s*\(g\)$/,''))} <b>${nfmt(+r.pesoMassa,0)} g</b></div>`:'',
    r.pesoLiquido?`<div class="chip">Peso líq. <b>${nfmt(+r.pesoLiquido,0)} g</b></div>`:'',
    r.validade?`<div class="chip">Validade <b>${esc(String(r.validade))} dia(s)</b></div>`:'',
  ].filter(Boolean).join('');

  const prep=(r.preparacao&&r.preparacao.length)
    ? `<div class="card"><div class="card-t">Preparação</div><div class="card-b">
         <ol class="prep">${r.preparacao.map(x=>`<li>${esc(x)}</li>`).join('')}</ol></div></div>`
    : '';

  return `
    <div class="det-top">
      <button class="bt" data-back>&larr;</button>
      <div class="tt">${esc(r.nome)}</div>
      <button class="bt cor ${r.favorito?'on':''}" data-fav="${r.id}">${r.favorito?IC.coracaoOn:IC.coracaoOff}</button>
      <button class="bt" data-edit="${r.id}">${IC.edit}</button>
    </div>

    ${r.foto?`<div class="det-foto"><img src="${esc(r.foto)}" alt=""></div>`:''}
    ${r.descricao?`<p class="desc">${esc(r.descricao)}</p>`:''}
    ${chips?`<div class="chips">${chips}</div>`:''}

    <div class="card">
      <div class="card-t"><span>Calcular</span><button class="btn ghost small" data-reset style="padding:6px 12px">Repor base</button></div>
      <div class="card-b">
        ${temPeso?`<div class="seg">
          <button data-mode="farinha"  class="${STATE.calcMode==='farinha'?'active':''}">${esc(pf.porBase)}</button>
          <button data-mode="unidades" class="${STATE.calcMode==='unidades'?'active':''}">Por ${esc(pf.unidades)}</button>
        </div>`:''}
        <div class="ref-line">${STATE.calcMode==='farinha'
          ? `Referência: <b>${esc(ref?ref.nome:'—')}</b> (base ${nfmt(br,3)} kg)`
          : `Base: <b>${bu}</b> ${esc(pf.unidades)} de ${nfmt(+r.pesoMassa||0,0)} g`}</div>
        <div class="calc-input">
          <input id="calcVal" inputmode="decimal" value="${STATE.calcValue!=null?esc(String(STATE.calcValue)):''}" placeholder="${STATE.calcMode==='farinha'?nfmt(br,3):String(bu)}">
          <span class="unit">${STATE.calcMode==='farinha'?'kg':esc(pf.unidade)}</span>
        </div>
        <div class="factor-note" id="factorNote">Fator <b>${nfmt(factor,3)}×</b></div>
      </div>
    </div>

    <div class="card">
      <div class="card-t">Matérias-primas</div>
      <div class="card-b" style="padding:10px 12px 14px">
        <table class="ing">
          <thead><tr><th>Matéria-prima</th><th class="n">Base</th><th class="n">%</th><th class="n">A pesar</th></tr></thead>
          <tbody>
            ${rows}
            <tr class="sep"><td>${esc(pf.rendimento)}</td><td class="n">${nfmt(by,3)}</td><td></td><td class="n" id="totMass">${nfmt(totMass,3)}</td></tr>
            ${temPeso?`<tr class="sep" style="border:0"><td>${esc(pf.contagem)}</td><td class="n">${bu}</td><td></td><td class="n" id="totUnits">${totUnits}</td></tr>`:''}
          </tbody>
        </table>
        <div class="legend">
          <span class="tag ref">REF</span> base do cálculo (a caixa sombreada da ficha) &nbsp;
          <span class="tag far">${esc(pf.base.sigla)}</span> farinha — a soma delas é 100% &nbsp;
          <span class="tag ext">${esc(pf.fora.sigla)}</span> não entra no rendimento da massa (tender, arroz) &nbsp;
          <span class="tag fas">FASES</span> adicionado em momentos diferentes — as linhas <span class="arw" style="color:var(--blue);font-weight:800">&#8627;</span> somam o total acima<br>
          Quantidades em kg.
        </div>
      </div>
    </div>

    ${prep}
  `;
}

/* ---------------- MODO COZINHAR ---------------- */
function renderCozinhar(){
  const r=recipes.find(x=>x.id===STATE.cozinhar);
  if(!r || !r.preparacao || !r.preparacao.length){ STATE.cozinhar=null; return render(); }
  const i=Math.min(Math.max(0,STATE.passo||0), r.preparacao.length-1);
  STATE.passo=i;
  const ultimo = i===r.preparacao.length-1;
  const fator=factorOf(r);
  const simples=ehSimples(r.categoria);

  const ings=r.ingredientes.map(x=>{
    const q = simples ? qtdTexto(x,fator) : nfmt(x.qtd*fator,3)+' kg';
    return `${esc(x.nome)} <b>${q}</b>`;
  }).join(' · ');

  $app.innerHTML=`
    <div class="cook">
      <div class="ch">
        <button class="x" id="ckFechar">&times;</button>
        <div class="t">${esc(r.nome)}</div>
        <div class="c">${i+1} / ${r.preparacao.length}</div>
      </div>
      <div class="barra"><i style="width:${Math.round((i+1)/r.preparacao.length*100)}%"></i></div>
      <div class="corpo">
        <div class="num">${i+1}</div>
        <div class="txt">${esc(r.preparacao[i])}</div>
        <div class="ings">
          <h4>Ingredientes${Math.abs(fator-1)>0.001?' (já ajustados)':''}</h4>
          <div>${ings}</div>
        </div>
      </div>
      <div class="pe">
        <button class="ant" id="ckAnt" ${i===0?'disabled style="opacity:.4"':''}>Anterior</button>
        <button class="seg" id="ckSeg">${ultimo?'Terminar':'Seguinte'}</button>
      </div>
    </div>`;

  document.getElementById('ckFechar').onclick=()=>{ STATE.cozinhar=null; render(); };
  document.getElementById('ckAnt').onclick=()=>{ if(i>0){ STATE.passo=i-1; renderCozinhar(); } };
  document.getElementById('ckSeg').onclick=()=>{
    if(ultimo){ STATE.cozinhar=null; toast('Bom proveito!'); render(); }
    else { STATE.passo=i+1; renderCozinhar(); }
  };
}

function openForm(id){
  if(id){ STATE.editRecipe = JSON.parse(JSON.stringify(recipes.find(x=>x.id===id))); }
  else {
    STATE.editRecipe = { id:null, nome:'', codigo:'', plu:'', descricao:'',
      pesoMassa:'', pesoLiquido:'', validade:'', preparacao:[], refIdx:0, favorito:false,
      categoria: STATE.categoria || 'pao',
      rende: perfil(STATE.categoria||'pao').rendePad || 4,
      foto:'', tempo:'', dificuldade:'Fácil', sub:STATE.sub||'', criada:Date.now(),

/* Um cartão com ícone à esquerda, como nas imagens */
function cx(icone, titulo, sub, corpo, obrig, extraTopo){
  return `

      <div class="${extraTopo?'cx-topo':''}">

function cabecaForm(r){
  const c=cat(r.categoria);
  return `
    <div class="fh">
      <button class="bt" data-back-form>&larr;</button>
      <div>
        <h1>${r.id?'Editar receita':'Nova receita'} · <span class="ar" id="trocaArea">${esc(c.nome)}</span></h1>
        <div class="s">${r.id?'Altera o que precisares e guarda. Toca na área para a mudar.'
                             :'Adiciona uma nova receita de '+esc(c.nome.toLowerCase())+'.'}</div>
      </div>

      </div></div></div></div>`:''}`;
}

/* Tempo: guardado sempre em minutos, mostrado em min ou h */
function tempoParaCampo(r){
  const m=+r.tempo||0;
  if(STATE.tempoUn==='h' || (m>=60 && m%60===0 && STATE.tempoUn!=='min'))
    return {v: m? nfmt(m/60, m%60?1:0).replace(/,0$/,'') : '', u:'h'};
  return {v: m?String(m):'', u:'min'};
}

function cartaoTempo(r){
  const tc=tempoParaCampo(r);
  return cx(IC.relogio,'Tempo de preparação','Opcional',`
    <div class="lin2">
      <input class="input" id="f_tempo" inputmode="decimal" value="${esc(tc.v)}" placeholder="—">
      <select class="input" id="f_tempoUn">
        <option value="min" ${tc.u==='min'?'selected':''}>min</option>
        <option value="h"   ${tc.u==='h'?'selected':''}>h</option>
      </select>
    </div>`);
}

function cartaoDificuldade(r){
  return cx(IC.nivel,'Dificuldade','Opcional',
    `<div class="pilhas">${DIFICULDADES.map(d=>
      `<button type="button" data-dif="${esc(d)}" class="${r.dificuldade===d?'on':''}">${esc(d)}</button>`).join('')}</div>`);
}

function cartaoTipo(r){
  const subs=subsDe(r.categoria);

  return cx(IC.etiqueta,'Categoria','Opcional',
    `<select class="input" id="f_sub">

function cartaoIngredientes(r, corpo, titulo, sub){

function cartaoPreparacao(r, obrig){

function cartaoImagem(r){
  const corpo = r.foto
    ? `<div class="img-prev"><img src="${esc(r.foto)}" alt=""><button type="button" class="rmf" id="rmFoto">&times;</button></div>`

/* ---- formulário da padaria ---- */
function viewForm(){
  const r=STATE.editRecipe;
  if(ehSimples(r.categoria)) return viewFormSimples(r);
  const pf=perfil(r.categoria);

  const ings=r.ingredientes.map((i,idx)=>{
    i.fases=i.fases||[];
    let fasesHtml='';
    if(i.fases.length){
      const soma=i.fases.reduce((s,f)=>s+(pnum(f.qtd)||0),0);
      const tot=pnum(i.qtd)||0;
      const ok=Math.abs(soma-tot)<0.0005;
      fasesHtml=`<div class="fase-list">
        ${i.fases.map((f,fi)=>`
          <div class="fase-row" data-fase="${fi}">
            <span class="arw">&#8627;</span>
            <input class="input" data-ff="nome" placeholder="Ex.: no início" value="${esc(f.nome)}">
            <input class="input fq" data-ff="qtd" inputmode="decimal" placeholder="0,000" value="${esc(vfmt(f.qtd))}">
            <button type="button" class="rm" data-rmfase="${fi}">&times;</button>

        <div class="fase-sum ${ok?'ok':'bad'}">${i.fases.map(f=>nfmt(pnum(f.qtd)||0,3)).join(' + ')} = ${nfmt(soma,3)} ${ok?'✓':'≠ '+nfmt(tot,3)}</div>

  const nDet=['codigo','plu','descricao','pesoMassa','pesoLiquido','validade']

  return cabecaForm(r)

        `<div class="fold ${STATE.foldOpen?'open':''}">
          <button type="button" class="fold-t" id="foldToggle">Abrir<span class="cnt">${nDet} de 6</span><span class="ar">&#9660;</span></button>

              <div class="field"><label>${esc(pf.pesoLabel)}</label><input class="input" id="f_pesoMassa" inputmode="decimal" value="${esc(vfmt(r.pesoMassa))}" placeholder="—"></div>
              <div class="field"><label>Peso líq. (g)</label><input class="input" id="f_pesoLiquido" inputmode="decimal" value="${esc(vfmt(r.pesoLiquido))}" placeholder="—"></div>
              <div class="field"><label>Validade</label><input class="input" id="f_validade" inputmode="numeric" value="${esc(vfmt(r.validade))}" placeholder="—"></div>

/* ---------------- REGISTO DE ALTERAÇÕES ---------------- */
const CH_LABEL={add:'ADIÇÃO',chg:'ALTERAÇÃO',fix:'CORREÇÃO',rem:'REMOÇÃO'};
/* o que foi acrescentado primeiro, o que foi corrigido por último */
const CH_ORDEM={add:0, chg:1, fix:2, rem:3};

/* "28-09-2026" -> "28 de setembro de 2026" */
function dataPorExtenso(d){
  const m=String(d||'').match(/^(\d{2})-(\d{2})-(\d{4})$/);
  if(!m) return d||'';
  const meses=['janeiro','fevereiro','março','abril','maio','junho',
               'julho','agosto','setembro','outubro','novembro','dezembro'];
  return `${+m[1]} de ${meses[+m[2]-1]} de ${m[3]}`;
}

function viewChangelog(){
  const cards=CHANGELOG.map((c,i)=>{
    const linhas=c.linhas.slice().sort((a,b)=>(CH_ORDEM[a[0]]??9)-(CH_ORDEM[b[0]]??9));
    const n=linhas.length;
    return `
    <div class="ver-card">
      <div class="ver-head">
        <span class="num">Versão ${esc(c.v)}</span>
        ${i===0?'<span class="now">ATUAL</span>':''}
        <span class="dt">${esc(dataPorExtenso(c.data))}</span>
      </div>
      ${c.nota?`<div class="ver-nota">${esc(c.nota)}</div>`:''}
      <div class="ver-body">
        <div class="ver-cnt">${n} ${n===1?'alteração':'alterações'}</div>
        ${linhas.map(([k,t])=>`<div class="ch"><span class="k ${k}">${CH_LABEL[k]||k}</span><span>${esc(t)}</span></div>`).join('')}
      </div>
    </div>`;
  }).join('');

  const total=CHANGELOG.reduce((s,c)=>s+c.linhas.length,0);
  return `
    <div class="detail-hdr">
      <button class="back" data-back-set>&larr;</button>
      <div class="ttl">Registo de alterações</div>
    </div>
    <p class="desc">Uma versão por dia de trabalho. Tudo o que muda no mesmo dia entra na versão desse dia.</p>
    ${cards}
    <div class="ver-foot">${CHANGELOG.length} ${CHANGELOG.length===1?'versão':'versões'} · ${total} alterações no total</div>
  `;
}

/* ---------------- HANDLERS ---------------- */
function bindBody(){
  // abrir receita
  $app.querySelectorAll('[data-open]').forEach(el=>el.onclick=(e)=>{
    if(e.target.closest('[data-fav]')) return;
    openRecipe(el.dataset.open);
  });
  // favorito
  $app.querySelectorAll('[data-fav]').forEach(b=>b.onclick=(e)=>{
    e.stopPropagation();
    const r=recipes.find(x=>x.id===b.dataset.fav); if(!r)return;
    r.favorito=!r.favorito; save(K.recipes,recipes);
    toast(r.favorito?'Adicionada às favoritas':'Removida das favoritas');
    /* no Início a secção Favoritas tem de mudar; na lista não, senão o cartão salta debaixo do dedo */
    if(STATE.tab==='inicio' || STATE.view==='detail'){ render(); }
    else { b.classList.toggle('on',r.favorito); b.innerHTML=r.favorito?IC.coracaoOn:IC.coracaoOff; }
  });
  // ir para aba
  $app.querySelectorAll('[data-goto]').forEach(b=>b.onclick=()=>{ STATE.tab=b.dataset.goto; STATE.view='list'; render(); });

  // lista: subcategorias, ordenação, vista, nova receita
  $app.querySelectorAll('[data-sub]').forEach(b=>b.onclick=()=>{ STATE.sub=b.dataset.sub; render(); });
  const so=document.getElementById('selOrdem'); if(so) so.onchange=()=>{ STATE.ordem=so.value; render(); };
  $app.querySelectorAll('[data-vista]').forEach(b=>b.onclick=()=>{ STATE.vista=b.dataset.vista; render(); });
  const bn=document.getElementById('btnNova'); if(bn) bn.onclick=()=>openForm(null);

  // detalhe: separadores, escala, cozinhar
  $app.querySelectorAll('[data-aba]').forEach(b=>b.onclick=()=>{ STATE.aba=b.dataset.aba; render(); });
  const stD=document.getElementById('stDoses'); if(stD) stD.onclick=()=>{ STATE.escalaAberta=!STATE.escalaAberta; render(); };
  const bc=document.getElementById('btnCozinhar');
  if(bc) bc.onclick=()=>{ STATE.cozinhar=STATE.activeRecipe; STATE.passo=0; render(); };

  // Início: ações rápidas
  const qs=document.getElementById('qaSearch');
  if(qs) qs.onclick=()=>{ STATE.tab='receitas'; STATE.view='list'; render(); setTimeout(()=>{const s=document.getElementById('searchBox'); if(s)s.focus();},60); };
  const qn=document.getElementById('qaNew'); if(qn) qn.onclick=()=>openForm(null);
  const cr=document.getElementById('clrRecent'); if(cr) cr.onclick=()=>{ recent=[]; save(K.recent,recent); render(); };

  // pesquisa
  const sb=document.getElementById('searchBox');
  if(sb) sb.oninput=()=>{
    STATE.search=sb.value;
    const res=document.getElementById('results');
    if(res){ res.innerHTML=recipeList(filtered()); bindResults(res); }
    const c=document.getElementById('clrSearch'); if(c) c.style.visibility=STATE.search?'visible':'hidden';
  };
  const cs=document.getElementById('clrSearch');
  if(cs) cs.onclick=()=>{ STATE.search=''; render(); };

  // detalhe
  const back=$app.querySelector('[data-back]'); if(back) back.onclick=()=>{ STATE.view='list'; render(); };
  const ed=$app.querySelector('[data-edit]'); if(ed) ed.onclick=()=>openForm(ed.dataset.edit);
  $app.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{ STATE.calcMode=b.dataset.mode; STATE.calcValue=null; render(); });
  const cv=document.getElementById('calcVal'); if(cv) cv.oninput=()=>{ STATE.calcValue=cv.value; refreshCalc(); };
  const rs=$app.querySelector('[data-reset]'); if(rs) rs.onclick=()=>{ STATE.calcValue=null; render(); };

  // form

  $app.querySelectorAll('[data-rende]').forEach(b=>b.onclick=()=>{

  $app.querySelectorAll('[data-du]').forEach(b=>b.onclick=()=>{

function refreshCalc(){
  const r=recipes.find(x=>x.id===STATE.activeRecipe); if(!r)return;
  const factor=factorOf(r);
  const simples=ehSimples(r.categoria);
  if(simples){
    $app.querySelectorAll('[data-q]').forEach(el=>{
      el.textContent=qtdTexto({qtd:parseFloat(el.dataset.q), unidade:el.dataset.u||''}, factor);
    });
    return;
  }
  $app.querySelectorAll('table.ing td.pesar[data-q]').forEach(td=>{

  });
  const totMass=baseYield(r)*factor;

  const tu=document.getElementById('totUnits'); if(tu) tu.textContent=(+r.pesoMassa>0)?Math.round(totMass*1000/(+r.pesoMassa)):0;
  const fn=document.getElementById('factorNote'); if(fn) fn.innerHTML=`Fator <b>${nfmt(factor,3)}×</b>`;
}

function syncForm(){
  const r=STATE.editRecipe; if(!r)return;
  /* com a secção de detalhes recolhida esses campos não existem no ecrã:
     têm de manter o valor que já tinham, em vez de serem apagados */
  const g=(id,atual)=>{ const e=document.getElementById(id); return e?e.value:atual; };
  if(document.getElementById('f_nome')){
    r.nome=g('f_nome',r.nome);
    r.codigo=g('f_codigo',r.codigo); r.plu=g('f_plu',r.plu); r.descricao=g('f_descricao',r.descricao);
    r.pesoMassa=g('f_pesoMassa',r.pesoMassa); r.pesoLiquido=g('f_pesoLiquido',r.pesoLiquido);
    r.validade=g('f_validade',r.validade);
  }
  const prep=document.getElementById('f_prep');
  if(prep) r.preparacao=prep.value.split('\n').map(s=>s.trim()).filter(Boolean);
  const re=document.getElementById('f_rende'); if(re) r.rende=re.value;
  const te=document.getElementById('f_tempo'), tu=document.getElementById('f_tempoUn');
  if(te){
    const n=pnum(te.value);
    const un=tu?tu.value:(STATE.tempoUn||'min');
    r.tempo = isNaN(n)?0:Math.round(un==='h'? n*60 : n);
    STATE.tempoUn=un;
  }
  const sb=document.getElementById('f_sub'); if(sb) r.sub=sb.value;
  $app.querySelectorAll('[data-ing]').forEach(row=>{
    const idx=+row.dataset.ing; const ing=r.ingredientes[idx]; if(!ing)return;
    ing.nome=row.querySelector('[data-f="nome"]').value;
    ing.qtd =row.querySelector('[data-f="qtd"]').value;
    const un=row.querySelector('[data-f="unidade"]'); if(un) ing.unidade=un.value;
    row.querySelectorAll('[data-fase]').forEach(fr=>{
      const fi=+fr.dataset.fase; if(!ing.fases[fi])return;
      ing.fases[fi].nome=fr.querySelector('[data-ff="nome"]').value;
      ing.fases[fi].qtd =fr.querySelector('[data-ff="qtd"]').value;
    });
  });
}

let aGuardar=false;
function saveRecipe(){
  if(aGuardar) return;              // trava contra duplo toque no botão
  syncForm();
  const r=STATE.editRecipe;
  if(!r.nome.trim()){ toast('Falta o nome'); return; }
  if(ehSimples(r.categoria)){
    if(!(r.preparacao&&r.preparacao.length)){ toast('Falta a preparação'); return; }
    return guardarSimples(r);
  }
  /* peso por unidade é opcional: 0 significa "não sei" e a app esconde as unidades */
  const pmRaw=pnum(r.pesoMassa);
  const pm=(isNaN(pmRaw)||pmRaw<0)?0:pmRaw;

  const keep=[];
  r.ingredientes.forEach((i,idx)=>{
    const nome=(i.nome||'').trim(), q=pnum(i.qtd);
    if(!nome || isNaN(q)) return;
    const fases=(i.fases||[]).map(f=>({nome:(f.nome||'').trim(),qtd:pnum(f.qtd)}))
                             .filter(f=>f.nome && !isNaN(f.qtd));
    keep.push({i:{nome:nome,qtd:q,farinha:!!i.farinha,extra:!!i.extra,fases:fases}, old:idx});
  });
  for(const k of keep){
    if(!k.i.fases.length) continue;
    const soma=k.i.fases.reduce((s,f)=>s+f.qtd,0);
    if(Math.abs(soma-k.i.qtd)>0.0005){
      if(!confirm(`As fases de "${k.i.nome}" somam ${nfmt(soma,3)} mas o total é ${nfmt(k.i.qtd,3)}. Guardar assim mesmo?`)) return;
    }
  }
  if(!keep.length){ toast('Adiciona pelo menos um ingrediente'); return; }
  const ings=keep.map(k=>k.i);
  let refIdx=keep.findIndex(k=>k.old===r.refIdx);
  if(refIdx<0){ const f=ings.findIndex(i=>i.farinha&&!i.extra); refIdx=f>=0?f:0; }
  if(ings[refIdx].qtd<=0){ toast('A referência não pode ser 0'); return; }
  if(!ings.some(i=>i.farinha&&!i.extra)){
    if(!confirm(`Nenhum ingrediente está marcado como ${perfil(r.categoria).base.sigla}. A coluna % vai ficar vazia. Continuar?`)) return;
  }

  const rec={
    id:r.id||uid(), nome:r.nome.trim(), codigo:(r.codigo||'').trim(), plu:(r.plu||'').trim(),
    descricao:(r.descricao||'').trim(), pesoMassa:pm, pesoLiquido:pnum(r.pesoLiquido)||0,
    validade:(r.validade||'').toString().trim(), preparacao:r.preparacao||[],
    ingredientes:ings, refIdx:refIdx, favorito:!!r.favorito,
    categoria: CAT_POR_ID[r.categoria] ? r.categoria : (STATE.categoria||'pao'),
    foto:r.foto||'', tempo:Math.max(0,Math.round(pnum(r.tempo)||0)),
    dificuldade:DIFICULDADES.indexOf(r.dificuldade)>=0?r.dificuldade:'Fácil',
    sub:r.sub||'', criada:r.criada||Date.now(),
    /* editaste uma receita de exemplo: fica tua, deixa de ser substituída nas atualizações */
    seedId:r.seedId, dirty: r.seedId ? true : undefined
  };
  const i = r.id ? recipes.findIndex(x=>x.id===r.id) : -1;
  if(i >= 0) recipes[i]=rec;
  else {
    /* se a receita foi apagada entretanto, ou é nova, entra como nova */
    recipes.push(rec);
    r.id = rec.id;   // impede que um segundo toque em Guardar crie outra cópia
  }
  save(K.recipes,recipes);
  STATE.activeRecipe=rec.id; STATE.view='detail'; STATE.calcMode='farinha'; STATE.calcValue=null;
  aGuardar=true; setTimeout(()=>{aGuardar=false;},600);
  /* mudaste a área da receita: acompanha-a, senão parecia que tinha desaparecido */
  if(rec.categoria !== STATE.categoria){
    STATE.categoria = rec.categoria; save(K.ultimaCat,rec.categoria); gravarSessao();
    toast('Guardada em '+cat(rec.categoria).nome);
  } else toast('Receita guardada');
  render();
}

function guardarSimples(r){
  const pf=perfil(r.categoria);
  const ings=r.ingredientes
    .map(i=>({nome:(i.nome||'').trim(), qtd:pnum(i.qtd), unidade:i.unidade||pf.unidadePad||'g',
              farinha:false, extra:false, fases:[]}))
    .filter(i=>i.nome)
    .map(i=>({...i, qtd: isNaN(i.qtd)?0:i.qtd}));
  if(!ings.length){ toast('Adiciona pelo menos um ingrediente'); return; }

  const rende=Math.max(1, Math.round(pnum(r.rende)||pf.rendePad||4));
  const rec={
    id:r.id||uid(), nome:r.nome.trim(), codigo:(r.codigo||'').trim(), plu:(r.plu||'').trim(),
    descricao:(r.descricao||'').trim(), validade:(r.validade||'').toString().trim(),
    pesoMassa:0, pesoLiquido:0, preparacao:r.preparacao||[],
    ingredientes:ings, refIdx:0, favorito:!!r.favorito,
    categoria:r.categoria, rende:rende,
    foto:r.foto||'', tempo:Math.max(0,Math.round(pnum(r.tempo)||0)),
    dificuldade:DIFICULDADES.indexOf(r.dificuldade)>=0?r.dificuldade:'Fácil',
    sub:r.sub||'', criada:r.criada||Date.now(),
    seedId:r.seedId, dirty: r.seedId ? true : undefined
  };
  const i = r.id ? recipes.findIndex(x=>x.id===r.id) : -1;
  if(i>=0) recipes[i]=rec; else { recipes.push(rec); r.id=rec.id; }
  save(K.recipes,recipes);

  STATE.activeRecipe=rec.id; STATE.view='detail'; STATE.calcValue=null;
  aGuardar=true; setTimeout(()=>{aGuardar=false;},600);
  if(rec.categoria!==STATE.categoria){
    STATE.categoria=rec.categoria; save(K.ultimaCat,rec.categoria); gravarSessao();
    toast('Guardada em '+cat(rec.categoria).nome);
  } else toast('Receita guardada');
  render();
}

function deleteRecipe(){
  const r=STATE.editRecipe; if(!r.id)return;
  if(!confirm('Eliminar esta receita?'))return;
  recipes=recipes.filter(x=>x.id!==r.id); save(K.recipes,recipes);
  recent=recent.filter(x=>x!==r.id); save(K.recent,recent);

/* ---------------- ATUALIZAÇÕES PELO GITHUB ----------------
   A app pergunta ao GitHub qual é a última versão publicada e compara com a
   que está a correr. Não se atualiza sozinha — dá-te o link para a descarregar,
   que é o que se pode fazer sem servidor nenhum. */

/* "0.4" vs "0.10": comparar número a número, não como texto */
function comparaVersao(a,b){
  const pa=String(a||'').replace(/^v/i,'').split('.').map(n=>parseInt(n,10)||0);
  const pb=String(b||'').replace(/^v/i,'').split('.').map(n=>parseInt(n,10)||0);
  for(let i=0;i<Math.max(pa.length,pb.length);i++){
    const x=pa[i]||0, y=pb[i]||0;
    if(x!==y) return x>y?1:-1;
  }
  return 0;
}

function verificarAtualizacoes(){
  const repo=(config.repo||'').trim().replace(/^https?:\/\/github\.com\//i,'').replace(/\/+$/,'');
  if(!/^[\w.-]+\/[\w.-]+$/.test(repo)){
    STATE.updInfo={tipo:'erro', html:'<b>Falta o repositório</b>Escreve-o como <i>utilizador/repositorio</i>, por exemplo Bernas717/padaria.'};
    return render();
  }
  STATE.updInfo={tipo:'atual', html:'A verificar...'};
  render();

  fetch(`https://api.github.com/repos/${repo}/releases/latest`, {headers:{'Accept':'application/vnd.github+json'}})
    .then(res=>{
      if(res.status===404) throw {cod:404};
      if(res.status===403) throw {cod:403};
      if(!res.ok) throw {cod:res.status};
      return res.json();
    })
    .then(rel=>{
      const tag=(rel.tag_name||'').replace(/^v/i,'');
      const dif=comparaVersao(tag, APP_VER);
      const apk=(rel.assets||[]).find(a=>/\.apk$/i.test(a.name||''));
      const link=apk? apk.browser_download_url : rel.html_url;
      const quando=rel.published_at? new Date(rel.published_at).toLocaleDateString('pt-PT') : '';
      if(dif>0){
        STATE.updInfo={tipo:'nova', html:
          `<b>Há uma versão nova: ${esc(tag)}</b>`+
          `Estás na ${esc(APP_VER)}${quando?' · publicada a '+esc(quando):''}.<br>`+
          `<a href="${esc(link)}" target="_blank" rel="noopener">${apk?'Descarregar o APK':'Abrir no GitHub'}</a>`};
      }else{
        STATE.updInfo={tipo:'atual', html:
          `<b>Estás na versão mais recente</b>`+
          `${esc(APP_VER)}${tag&&tag!==APP_VER?' (a publicada é a '+esc(tag)+')':''}.`};
      }
      render();
    })
    .catch(e=>{
      let m;
      if(e && e.cod===404) m='<b>Não encontrei esse repositório</b>Ou o nome está errado, ou ainda não publicaste nenhuma versão lá. Confere o nome acima.';
      else if(e && e.cod===403) m='<b>O GitHub recusou o pedido</b>Demasiados pedidos seguidos. Tenta daqui a bocado.';
      else m='<b>Não consegui ligar ao GitHub</b>Verifica a ligação à internet e tenta outra vez.';
      STATE.updInfo={tipo:'erro', html:m};
      render();
    });
}

/* ---------------- DADOS ---------------- */
function bytesTexto(n){
  if(n<1024) return n+' B';
  if(n<1024*1024) return (n/1024).toFixed(0)+' KB';
  return (n/1048576).toFixed(1).replace('.',',')+' MB';
}
function tamanhoDados(){
  let t=0;
  try{ for(const k of Object.values(K)){ const v=localStorage.getItem(k); if(v) t+=v.length; } }catch(e){}
  return bytesTexto(t);
}
function nFotos(){ return recipes.filter(r=>r.foto).length; }

function descarregar(nome, conteudo, tipo){
  const blob=new Blob([conteudo],{type:tipo});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob); a.download=nome; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),1500);
}
function carimbo(){
  const d=new Date(), p=n=>String(n).padStart(2,'0');
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`;
}

/* Cópia de segurança: receitas, definições e recentes, fotos incluídas.
   Os utilizadores e os PIN ficam de fora de propósito — não vale a pena
   andar com PIN dentro de um ficheiro que se partilha. */
function fazerBackup(){
  const dados={
    app:'padaria', versao:APP_VER, data:new Date().toISOString(),
    receitas:recipes, config:config, recentes:recent
  };
  const txt=JSON.stringify(dados,null,2);
  descarregar(`padaria-copia-${carimbo()}.json`, txt, 'application/json');
  toast(`Cópia guardada · ${bytesTexto(txt.length)}`);
}

function exportarCsv(){
  const sep=';';   // o Excel português usa ponto e vírgula
  const q=v=>`"${String(v==null?'':v).replace(/"/g,'""')}"`;
  const linhas=[['Área','Receita','Código','PLU','Rende','Ingrediente','Quantidade','Unidade','Marca','Preparação']
    .map(q).join(sep)];
  recipes.slice().sort((a,b)=>(a.categoria+a.nome).localeCompare(b.categoria+b.nome,'pt')).forEach(r=>{
    const simples=ehSimples(r.categoria);
    const rende=simples? rendeBase(r)+' '+perfil(r.categoria).dose
                       : (baseUnits(r)? baseUnits(r)+' un' : '');
    const prep=(r.preparacao||[]).map((x,i)=>(i+1)+'. '+x).join(' ');
    if(!r.ingredientes.length) linhas.push([cat(r.categoria).nome,r.nome,r.codigo,r.plu,rende,'','','','',prep].map(q).join(sep));
    r.ingredientes.forEach((i,idx)=>{
      const marcas=simples? '' :
        [idx===r.refIdx?'REF':'', i.farinha?'FARINHA':'', i.extra?'EXTRA':''].filter(Boolean).join(' ');
      linhas.push([
        cat(r.categoria).nome, r.nome, r.codigo, r.plu, rende,
        i.nome, nfmt(i.qtd,3), simples?(i.unidade||''):'kg', marcas,
        idx===0?prep:''
      ].map(q).join(sep));
    });
  });
  /* o BOM faz o Excel abrir os acentos corretamente */
  descarregar(`padaria-receitas-${carimbo()}.csv`, '﻿'+linhas.join('\r\n'), 'text/csv;charset=utf-8');
  toast('Folha exportada');
}

function exportData(){
  const blob=new Blob([JSON.stringify(recipes,null,2)],{type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
  a.download='receitas-padaria.json'; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),1000);

function importData(e){
  const f=e.target.files[0]; if(!f)return;
  const rd=new FileReader();
  rd.onload=()=>{
    try{
      let d=JSON.parse(rd.result);
      /* aceita a cópia nova (um objeto) e as exportações antigas (uma lista) */
      if(d && !Array.isArray(d) && Array.isArray(d.receitas)){
        if(!confirm(`Restaurar ${d.receitas.length} receitas da cópia de ${(d.data||'').slice(0,10)}? As atuais são substituídas.`)) return;
        if(d.config){ config=Object.assign({},config,d.config); save(K.config,config); }
        if(Array.isArray(d.recentes)){ recent=d.recentes; save(K.recent,recent); }
        d=d.receitas;
      }
      if(!Array.isArray(d)) throw 0;
      recipes=d.map(x=>migrate({
        id:x.id||uid(), nome:x.nome||'Sem nome', codigo:x.codigo||'', plu:x.plu||'',
        descricao:x.descricao||'', pesoMassa:+x.pesoMassa||0, pesoLiquido:+x.pesoLiquido||0,
        validade:x.validade||'', preparacao:x.preparacao||[], refIdx:x.refIdx, favorito:!!x.favorito,
        ingredientes:x.ingredientes||[],
        foto:x.foto||'', tempo:+x.tempo||0, dificuldade:x.dificuldade,
        sub:x.sub||'', criada:x.criada||0, rende:x.rende
      }));
      save(K.recipes,recipes); toast('Restaurado ('+recipes.length+' receitas)'); render();
    }catch(err){ toast('Ficheiro inválido'); }
  };
  rd.readAsText(f); e.target.value='';
}

/* Arrastar ingredientes pela pega. Usa pointer events, que funcionam
   com dedo e com rato sem código separado para cada um. */
function ligarArrasto(){
  let deId=null, linhas=[];
  const rowSel='[data-ing]';

  $app.querySelectorAll('[data-pega]').forEach(pg=>{
    pg.onpointerdown=(ev)=>{
      ev.preventDefault();
      syncForm();
      deId=+pg.dataset.pega;
      linhas=[...$app.querySelectorAll(rowSel)];
      const linha=pg.closest(rowSel);
      if(linha) linha.classList.add('a-mover');
      pg.setPointerCapture(ev.pointerId);

      const mover=(e)=>{
        const y=e.clientY;
        let alvo=-1;
        linhas.forEach(l=>{
          const b=l.getBoundingClientRect();
          if(y>=b.top && y<=b.bottom) alvo=+l.dataset.ing;
        });
        if(alvo>=0 && alvo!==deId){
          const r=STATE.editRecipe;
          const [it]=r.ingredientes.splice(deId,1);
          r.ingredientes.splice(alvo,0,it);
          if(r.refIdx===deId) r.refIdx=alvo;
          else if(deId<r.refIdx && alvo>=r.refIdx) r.refIdx--;
          else if(deId>r.refIdx && alvo<=r.refIdx) r.refIdx++;
          deId=alvo;
          render();
          /* depois do render os elementos são outros: reatar no novo */
          const nova=$app.querySelector(`[data-pega="${alvo}"]`);
          if(nova){ nova.dispatchEvent(new PointerEvent('pointerdown',{pointerId:ev.pointerId,clientY:y,bubbles:true})); }
        }
      };
      const largar=()=>{
        pg.onpointermove=null; pg.onpointerup=null; pg.onpointercancel=null;
        const l=$app.querySelector('.a-mover'); if(l) l.classList.remove('a-mover');
        deId=null;
      };
      pg.onpointermove=mover;
      pg.onpointerup=largar;
      pg.onpointercancel=largar;
    };
  });
}

/* Redimensiona e comprime para caber no armazenamento do browser */
function encolherFoto(ficheiro, maxLado, feito){
  const fr=new FileReader();
  fr.onerror=()=>feito(null);
  fr.onload=()=>{
    const img=new Image();
    img.onerror=()=>feito(null);
    img.onload=()=>{
      let {width:w, height:h}=img;
      const esc_=Math.min(1, maxLado/Math.max(w,h));
      w=Math.round(w*esc_); h=Math.round(h*esc_);
      const cv=document.createElement('canvas'); cv.width=w; cv.height=h;
      cv.getContext('2d').drawImage(img,0,0,w,h);
      /* baixa a qualidade até caber em ~180 KB */
      let q=0.75, out=cv.toDataURL('image/jpeg',q);
      while(out.length>240000 && q>0.35){ q-=0.12; out=cv.toDataURL('image/jpeg',q); }
      feito(out);
    };
    img.src=fr.result;
  };
  fr.readAsDataURL(ficheiro);
}

/* ---------------- Relógio ---------------- */
function updateClock(){
  const el=document.getElementById('hdrDate'); if(!el)return;
  const now=new Date();
  const dias=['Domingo','Segunda-feira','Terça-feira','Quarta-feira','Quinta-feira','Sexta-feira','Sábado'];
  const meses=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
  const hora=`${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
  el.innerHTML=`<div class="clock">${hora}</div>${dias[now.getDay()]}, ${now.getDate()} ${meses[now.getMonth()]} ${now.getFullYear()}`;
}
setInterval(()=>{ if(STATE.screen==='app') updateClock(); }, 20000);

/* ---------------- Toast ---------------- */
let toastT;
function toast(msg){
  const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show');
  clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('show'),1800);
}
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
